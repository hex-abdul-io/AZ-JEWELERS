<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#78350f" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Golden Squircle Rounded Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Inner Shimmer Rim -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.4" />

  <!-- Faceted Diamond Gem Icon (Dark Navy with Golden Facet Lines) -->
  <g transform="translate(100, 100) scale(13)" stroke="#091424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Gem Body -->
    <polygon points="6,3 18,3 22,9 12,22 2,9" fill="#091424" />
    
    <!-- Gold Facet Reflection Lines -->
    <line x1="2" y1="9" x2="22" y2="9" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polyline points="11,3 8,9 12,22 16,9 13,3" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Pure White Diamond Shine Highlight -->
    <circle cx="18" cy="5" r="1.3" fill="#ffffff" stroke="none" />
  </g>
</svg>